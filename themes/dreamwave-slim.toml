[theme]
id = "dreamwave-slim"
name = "Dreamwave"
family_id = "dreamwave"
version = "1.0.1"
format_version = 1
author = "nowplaying"
description = "Minimal synthwave playback overlay with neon accents and a geometric sunset."

[theme.compatibility]
minimum_runtime = "0.1.0"

[canvas]
width = 420
height = 64
background = "transparent"

[layout]
direction = "horizontal"
alignment = "center"
spacing = 12
padding = 8

[artwork]
enabled = false
position = "left"
width = 0
height = 0
fit = "contain"
rendering = "auto"

[metadata]
show_title = true
show_artist = true
show_album = false
alignment = "start"

[progress]
enabled = true
position = "bottom"
height = 2

[animations]
enabled = true
reduced_motion_support = true
track_change = "crossfade"
track_change_duration_ms = 250

[colors]
background = "transparent"
text = "#fff1fa"
muted = "#c4afd9"
accent = "#ff78b9"

[html]
template = '''
<main class="dream" data-status="unknown" aria-live="polite">
  <div class="accent" aria-hidden="true"></div>

  <section class="details">
    <div class="eyebrow">
      <span class="status-dot"></span>
      <span id="status">WAITING</span>
      <span class="separator"></span>
      <span id="player">NO PLAYER</span>
    </div>

    <h1 id="title">Nothing playing</h1>
    <p id="artist">Waiting for player</p>
  </section>

  <div class="sun" aria-hidden="true">
    <i></i>
    <i></i>
    <i></i>
    <i></i>
  </div>

  <div class="progress-track">
    <progress
      id="progress"
      max="100"
      value="0"
      aria-label="Track progress"
    ></progress>
  </div>
</main>
'''

[css]
stylesheet = '''
:root {
  color-scheme: dark;
  font-family: Inter, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;

  --night: #160f30;
  --purple: #3d2865;
  --pink: #ff78b9;
  --soft-pink: #ff9acb;
  --cyan: #70e5f0;
  --orange: #ffb56b;
  --text: #fff1fa;
  --muted: #c4afd9;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  color: var(--text);
  background: transparent;
}

.dream {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 420px;
  height: 64px;
  padding: 8px 12px;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse 65% 130% at 95% 50%,
      rgb(112 57 139 / 20%),
      transparent 75%
    ),
    linear-gradient(
      90deg,
      rgb(22 15 48 / 65%),
      rgb(37 20 65 / 42%) 65%,
      transparent
    );
}

/* Accent stripe */

.accent {
  position: relative;
  z-index: 2;
  flex: 0 0 3px;
  height: 34px;
  border-radius: 99px;
  background: var(--pink);
  box-shadow: 0 0 12px rgb(255 120 185 / 30%);
  opacity: .75;
  transition: opacity 250ms ease, box-shadow 250ms ease;
}

.dream[data-status="playing"] .accent {
  opacity: 1;
  box-shadow: 0 0 15px rgb(255 120 185 / 65%);
}

.dream[data-status="paused"] .accent {
  opacity: .5;
}

.dream[data-status="stopped"] .accent,
.dream[data-status="unknown"] .accent {
  opacity: .3;
}

/* Metadata layout */

.details {
  position: relative;
  z-index: 2;
  display: flex;
  min-width: 0;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  overflow: hidden;
}

/* Player and status */

.eyebrow {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 7px;
  color: var(--soft-pink);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1.15px;
  white-space: nowrap;
}

.status-dot {
  width: 5px;
  height: 5px;
  flex: 0 0 5px;
  border-radius: 50%;
  background: #8e7aa9;
  transition: background 250ms ease, box-shadow 250ms ease;
}

.dream[data-status="playing"] .status-dot {
  background: var(--cyan);
  box-shadow: 0 0 8px rgb(112 229 240 / 75%);
  animation: pulse 2.5s ease-in-out infinite;
}

.dream[data-status="paused"] .status-dot {
  background: var(--orange);
  box-shadow: 0 0 7px rgb(255 181 107 / 35%);
}

.separator {
  width: 13px;
  height: 1px;
  flex: 0 0 13px;
  background: rgb(255 154 203 / 45%);
}

#player {
  min-width: 0;
  overflow: hidden;
  color: #a99acb;
  text-overflow: ellipsis;
}

/* Track title */

h1 {
  display: block;
  width: 100%;
  min-width: 0;
  margin: 0;
  overflow: hidden;
  color: var(--text);
  font-size: 15px;
  font-weight: 650;
  line-height: 18px;
  letter-spacing: -.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 0 16px rgb(255 120 185 / 12%);
}

/* Artist */

#artist {
  display: block;
  width: 100%;
  min-width: 0;
  margin: 0;
  overflow: hidden;
  color: #d8c8f1;
  font-size: 10px;
  font-weight: 450;
  line-height: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Decorative sunset */

.sun {
  position: absolute;
  z-index: 0;
  top: -68px;
  right: 22px;
  width: 112px;
  height: 112px;
  overflow: hidden;
  border-radius: 50%;
  background: linear-gradient(
    180deg,
    rgb(255 140 184 / 55%),
    rgb(162 91 225 / 38%) 65%,
    transparent 66%
  );
  opacity: .3;
  filter: drop-shadow(0 0 18px rgb(255 120 185 / 15%));
  animation: sunset-glow 8s ease-in-out infinite alternate;
}

.sun i {
  position: absolute;
  right: 0;
  left: 0;
  height: 4px;
  background: #271641;
}

.sun i:nth-child(1) { top: 50px; }
.sun i:nth-child(2) { top: 61px; }
.sun i:nth-child(3) { top: 73px; }
.sun i:nth-child(4) { top: 86px; }

/* Playback progress */

.progress-track {
  position: absolute;
  z-index: 3;
  right: 8px;
  bottom: 5px;
  left: 8px;
  height: 2px;
  overflow: hidden;
  border-radius: 99px;
  background: rgb(169 154 203 / 23%);
}

.progress-track progress {
  display: block;
  width: 100%;
  height: 2px;
  margin: 0;
  padding: 0;
  border: 0;
  appearance: none;
  background: transparent;
}

.progress-track progress::-webkit-progress-bar {
  border-radius: 99px;
  background: transparent;
}

.progress-track progress::-webkit-progress-value {
  border-radius: 99px;
  background: linear-gradient(
    90deg,
    var(--pink),
    var(--orange),
    var(--cyan)
  );
  box-shadow: 0 0 8px rgb(255 120 185 / 40%);
  transition: width 350ms linear;
}

.progress-track progress::-moz-progress-bar {
  border-radius: 99px;
  background: linear-gradient(
    90deg,
    var(--pink),
    var(--orange),
    var(--cyan)
  );
}

/* Track change animation */

.dream.is-changing .details {
  animation: track-arrive 250ms ease both;
}

/* Animations */

@keyframes pulse {
  0%, 100% {
    box-shadow: 0 0 4px rgb(112 229 240 / 40%);
  }
  50% {
    box-shadow: 0 0 11px rgb(112 229 240 / 85%);
  }
}

@keyframes sunset-glow {
  from {
    opacity: .2;
    transform: scale(.96);
  }
  to {
    opacity: .38;
    transform: scale(1.04);
  }
}

@keyframes track-arrive {
  from {
    opacity: .35;
    transform: translateY(3px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Accessibility */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
'''

[javascript]
source = '''
(() => {
  const $ = id => document.getElementById(id);

  const root = document.querySelector('.dream');
  const title = $('title');
  const artist = $('artist');
  const statusLabel = $('status');
  const playerLabel = $('player');
  const progress = $('progress');

  if (
    !root ||
    !window.NowPlaying ||
    typeof window.NowPlaying.subscribe !== 'function'
  ) {
    return;
  }

  let currentTrack = null;
  let changeTimer = 0;

  function render(snapshot) {
    if (!snapshot) return;

    const metadata = snapshot.metadata || {};

    const artists = Array.isArray(metadata.artists)
      ? metadata.artists
          .filter(value => typeof value === 'string' && value.trim())
          .join(' · ')
      : '';

    const connected = snapshot.connected === true;

    const status = connected &&
      typeof snapshot.status === 'string'
      ? snapshot.status
      : 'unknown';

    const nextTrack = metadata.trackId ||
      [metadata.title || '', artists].join('|');

    if (currentTrack !== null && nextTrack !== currentTrack) {
      root.classList.remove('is-changing');

      requestAnimationFrame(() => {
        root.classList.add('is-changing');
      });

      clearTimeout(changeTimer);

      changeTimer = setTimeout(() => {
        root.classList.remove('is-changing');
      }, 270);
    }

    currentTrack = nextTrack;

    title.textContent =
      typeof metadata.title === 'string' && metadata.title.trim()
        ? metadata.title.trim()
        : connected ? 'Unknown track' : 'Nothing playing';

    artist.textContent = artists ||
      (connected ? 'Unknown artist' : 'Waiting for player');

    statusLabel.textContent = ({
      playing: 'NOW PLAYING',
      paused: 'PAUSED',
      stopped: 'STOPPED',
      unknown: 'WAITING'
    })[status] || 'WAITING';

    playerLabel.textContent =
      snapshot.player &&
      typeof snapshot.player.identity === 'string'
        ? snapshot.player.identity
        : 'NO PLAYER';

    root.dataset.status = status;

    const duration = Number.isFinite(snapshot.durationMs) &&
      snapshot.durationMs > 0
        ? snapshot.durationMs
        : 0;

    const position = Number.isFinite(snapshot.positionMs) &&
      snapshot.positionMs >= 0
        ? snapshot.positionMs
        : 0;

    const percentage = duration > 0
      ? Math.max(0, Math.min(100, position / duration * 100))
      : 0;

    progress.value = percentage;
  }

  window.NowPlaying.subscribe(render);

  const current = window.NowPlaying.getState();
  if (current) render(current);
})();
'''
