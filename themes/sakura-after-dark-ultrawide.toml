[theme]
id = "sakura-after-dark-ultrawide"
name = "Sakura After Dark"
family_id = "sakura-after-dark"
version = "1.0.0"
format_version = 1
author = "nowplaying"
description = "An atmospheric Japanese midnight-inspired music overlay with drifting sakura, a glowing vermilion sun, distant mountains and animated gold details."

[theme.compatibility]
minimum_runtime = "0.1.0"

[canvas]
width = 1000
height = 180
background = "transparent"

[layout]
direction = "horizontal"
alignment = "center"
spacing = 22
padding = 18

[artwork]
enabled = true
position = "left"
width = 116
height = 116
fit = "cover"
rendering = "auto"

[metadata]
show_title = true
show_artist = true
show_album = true
alignment = "start"

[progress]
enabled = true
position = "bottom"
height = 3

[animations]
enabled = true
reduced_motion_support = true
track_change = "crossfade"
track_change_duration_ms = 650

[colors]
background = "transparent"
text = "#f3e9e2"
muted = "#b8a9b4"
accent = "#e78b83"

[html]
template = '''
<main class="sakura" data-status="unknown" aria-live="polite">

  <div class="atmosphere" aria-hidden="true">
    <div class="ambient-glow"></div>
    <div class="moon-glow"></div>
    <div class="sun"></div>

    <svg class="mountains" viewBox="0 0 1000 180" preserveAspectRatio="none">
      <defs>
        <linearGradient id="mountain-fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7e718e" stop-opacity=".22"/>
          <stop offset="1" stop-color="#171b32" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0 145 L115 112 L175 133 L270 76 L355 133 L430 103 L520 145 L620 105 L710 135 L820 86 L920 132 L1000 110 L1000 180 L0 180Z"
        fill="url(#mountain-fade)"/>
      <path d="M0 153 L140 130 L240 148 L360 119 L470 153 L600 125 L740 150 L870 119 L1000 143"
        fill="none" stroke="#b18d9e" stroke-opacity=".19" stroke-width="1"/>
    </svg>

    <div class="horizon"></div>

    <div class="petals">
      <span class="petal p1"></span>
      <span class="petal p2"></span>
      <span class="petal p3"></span>
      <span class="petal p4"></span>
      <span class="petal p5"></span>
      <span class="petal p6"></span>
      <span class="petal p7"></span>
      <span class="petal p8"></span>
      <span class="petal p9"></span>
      <span class="petal p10"></span>
    </div>

    <div class="ornament ornament-left"></div>
    <div class="ornament ornament-right"></div>
  </div>

  <div class="art-frame">
    <div class="art-halo"></div>
    <img class="artwork" id="artwork" alt="Album artwork" hidden />
    <div class="art-fallback" id="art-fallback">
      <span class="fallback-symbol">花</span>
      <span class="fallback-caption">SAKURA</span>
    </div>
    <div class="art-border"></div>
  </div>

  <section class="details">
    <div class="eyebrow">
      <span class="status-indicator"></span>
      <span class="eyebrow-jp">音楽</span>
      <span class="eyebrow-divider"></span>
      <span id="playback-state">WAITING FOR PLAYBACK</span>
    </div>

    <h1 class="title" id="title">Nothing playing</h1>
    <p class="artist" id="artist">Waiting for your next song</p>
    <p class="album" id="album"></p>

    <div class="progress-row">
      <span class="time" id="elapsed">0:00</span>
      <div class="progress-track">
        <progress id="progress" max="100" value="0"
          aria-label="Track progress"></progress>
        <span class="progress-glow"></span>
      </div>
      <span class="time" id="duration">--:--</span>
    </div>
  </section>

  <aside class="scene" aria-hidden="true">
    <div class="scene-sun"></div>
    <div class="scene-ring ring-one"></div>
    <div class="scene-ring ring-two"></div>

    <svg class="torii" viewBox="0 0 180 130">
      <path d="M18 32 Q90 22 162 32 L157 40 Q90 34 23 40Z"
        fill="#d77d79" opacity=".8"/>
      <path d="M30 40 L36 113 M144 40 L138 113"
        stroke="#d77d79" stroke-width="5" stroke-linecap="round"/>
      <path d="M24 58 L150 58" stroke="#d77d79"
        stroke-width="3" opacity=".75"/>
      <path d="M18 29 Q90 15 162 29"
        fill="none" stroke="#f2c4a8" stroke-width="1.5" opacity=".8"/>
      <path d="M30 113 L144 113"
        stroke="#d77d79" stroke-width="2" opacity=".5"/>
    </svg>

    <div class="scene-kanji">夜</div>
    <div class="scene-caption">SAKURA AFTER DARK</div>
    <div class="scene-line"></div>
    <div class="scene-subcaption">桜 • 音楽 • 夜</div>
  </aside>

  <div class="edge-fade" aria-hidden="true"></div>
</main>
'''

[css]
stylesheet = '''
:root {
  color-scheme: dark;
  font-family: Inter, "Noto Sans CJK JP", "Yu Gothic",
    ui-sans-serif, system-ui, sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;

  --ink: #171a2e;
  --night: #22243b;
  --plum: #55445f;
  --rose: #d98591;
  --sakura: #f0b8c4;
  --vermilion: #e78b83;
  --gold: #d9bd91;
  --text: #f3e9e2;
  --muted: #b8a9b4;
  --dim: #827b94;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  color: var(--text);
  background: transparent;
}

.sakura {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  gap: 22px;
  width: 1000px;
  height: 180px;
  padding: 18px;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse 54% 100% at 75% 52%,
      rgb(65 45 75 / 32%) 0%,
      rgb(38 34 60 / 19%) 42%,
      transparent 100%
    ),
    radial-gradient(
      ellipse 42% 110% at 12% 50%,
      rgb(44 43 72 / 30%) 0%,
      transparent 100%
    );
}

.atmosphere {
  position: absolute;
  z-index: -1;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.ambient-glow {
  position: absolute;
  top: -100px;
  left: 38%;
  width: 500px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse,
    rgb(126 83 116 / 15%),
    rgb(75 62 105 / 7%) 45%,
    transparent 72%
  );
  filter: blur(12px);
  animation: ambient-breathe 12s ease-in-out infinite alternate;
}

.moon-glow {
  position: absolute;
  top: -75px;
  right: 100px;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgb(226 156 154 / 9%),
    rgb(205 136 150 / 4%) 42%,
    transparent 70%
  );
  animation: moon-breathe 9s ease-in-out infinite alternate;
}

.sun {
  position: absolute;
  top: 23px;
  right: 205px;
  width: 126px;
  height: 126px;
  border-radius: 50%;
  background: linear-gradient(
    155deg,
    rgb(239 160 145 / 26%),
    rgb(183 91 111 / 11%) 65%,
    transparent
  );
  box-shadow: 0 0 65px rgb(220 121 133 / 11%);
  animation: sun-pulse 10s ease-in-out infinite alternate;
}

.mountains {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: .85;
}

.horizon {
  position: absolute;
  right: 0;
  bottom: 20px;
  left: 0;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgb(214 163 169 / 12%) 20%,
    rgb(214 163 169 / 26%) 70%,
    transparent
  );
}

.ornament {
  position: absolute;
  width: 1px;
  height: 80px;
  background: linear-gradient(
    to bottom,
    transparent,
    rgb(217 189 145 / 26%),
    transparent
  );
}

.ornament-left {
  top: 20px;
  left: 5px;
}

.ornament-right {
  right: 5px;
  bottom: 15px;
}

.petal {
  position: absolute;
  display: block;
  width: 8px;
  height: 11px;
  border-radius: 80% 10% 80% 10%;
  background: linear-gradient(
    145deg,
    rgb(255 220 224 / 75%),
    rgb(213 129 159 / 55%)
  );
  box-shadow: 0 0 9px rgb(230 157 181 / 24%);
  opacity: 0;
  animation: petal-drift 13s linear infinite;
}

.p1 { left: 27%; top: -15px; animation-delay: 0s; }
.p2 { left: 39%; top: -25px; animation-delay: 2.3s; animation-duration: 16s; }
.p3 { left: 53%; top: -18px; animation-delay: 5s; animation-duration: 14s; }
.p4 { left: 68%; top: -20px; animation-delay: 1.1s; animation-duration: 18s; }
.p5 { left: 81%; top: -16px; animation-delay: 7s; animation-duration: 15s; }
.p6 { left: 91%; top: -22px; animation-delay: 3.4s; animation-duration: 17s; }
.p7 { left: 47%; top: -20px; animation-delay: 9s; animation-duration: 19s; }
.p8 { left: 74%; top: -20px; animation-delay: 11s; animation-duration: 16s; }
.p9 { left: 60%; top: -20px; animation-delay: 6s; animation-duration: 20s; }
.p10 { left: 33%; top: -20px; animation-delay: 13s; animation-duration: 17s; }

.art-frame {
  position: relative;
  z-index: 1;
  flex: 0 0 116px;
  width: 116px;
  height: 116px;
  overflow: visible;
  border-radius: 15px;
  background: linear-gradient(145deg, #39344e, #211f35);
}

.art-halo {
  position: absolute;
  inset: -13px;
  border-radius: 23px;
  background: radial-gradient(
    circle,
    rgb(222 143 157 / 17%),
    transparent 70%
  );
  filter: blur(8px);
  animation: halo-breathe 6s ease-in-out infinite alternate;
}

.artwork,
.art-fallback {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 14px;
}

.artwork {
  display: block;
  object-fit: cover;
  border: 1px solid rgb(240 205 194 / 28%);
}

.art-fallback {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid rgb(240 205 194 / 28%);
  background: linear-gradient(
    145deg,
    rgb(73 57 83 / 90%),
    rgb(30 29 50 / 94%)
  );
}

.fallback-symbol {
  color: var(--sakura);
  font-family: "Noto Serif CJK JP", "Yu Mincho", serif;
  font-size: 43px;
  line-height: 1;
  text-shadow: 0 0 24px rgb(240 184 196 / 38%);
}

.fallback-caption {
  color: var(--gold);
  font-size: 8px;
  letter-spacing: .28em;
}

.art-border {
  position: absolute;
  z-index: 2;
  inset: -4px;
  border: 1px solid rgb(217 189 145 / 30%);
  border-radius: 18px;
  pointer-events: none;
}

.details {
  position: relative;
  z-index: 2;
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
  padding: 2px 0;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 9px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .18em;
}

.status-indicator {
  width: 6px;
  height: 6px;
  flex: 0 0 6px;
  border-radius: 50%;
  background: var(--dim);
  box-shadow: 0 0 8px transparent;
  transition: background 300ms ease, box-shadow 300ms ease;
}

.sakura[data-status="playing"] .status-indicator {
  background: #a8d4b2;
  box-shadow: 0 0 11px rgb(168 212 178 / 65%);
  animation: status-glow 3s ease-in-out infinite;
}

.sakura[data-status="paused"] .status-indicator {
  background: var(--gold);
}

.eyebrow-jp {
  color: var(--rose);
  font-family: "Noto Sans CJK JP", sans-serif;
  font-size: 11px;
  letter-spacing: .12em;
}

.eyebrow-divider {
  width: 20px;
  height: 1px;
  background: rgb(217 189 145 / 45%);
}

.title {
  max-width: 100%;
  overflow: hidden;
  margin: 0;
  color: var(--text);
  font-size: 27px;
  font-weight: 650;
  line-height: 1.2;
  letter-spacing: -.025em;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 2px 16px rgb(10 10 20 / 25%);
}

.artist {
  overflow: hidden;
  margin: 7px 0 0;
  color: #e2aeb8;
  font-size: 15px;
  font-weight: 500;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.album {
  overflow: hidden;
  min-height: 14px;
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 13px;
}

.time {
  flex: 0 0 32px;
  color: var(--dim);
  font-size: 9px;
  font-variant-numeric: tabular-nums;
}

.time:last-child {
  text-align: right;
}

.progress-track {
  position: relative;
  min-width: 0;
  flex: 1;
  height: 3px;
  border-radius: 99px;
  background: rgb(166 146 169 / 22%);
}

.progress-track progress {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 3px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  border: 0;
  border-radius: 99px;
  appearance: none;
  background: transparent;
}

.progress-track progress::-webkit-progress-bar {
  border-radius: 99px;
  background: transparent;
}

.progress-track progress::-webkit-progress-value {
  border-radius: 99px;
  background: linear-gradient(
    90deg,
    #b87896,
    #e5a0a1,
    #e8c69b
  );
  transition: width 500ms linear;
}

.progress-track progress::-moz-progress-bar {
  border-radius: 99px;
  background: linear-gradient(
    90deg,
    #b87896,
    #e5a0a1,
    #e8c69b
  );
}

.progress-glow {
  position: absolute;
  top: -3px;
  left: 0;
  width: 10px;
  height: 9px;
  border-radius: 50%;
  background: rgb(240 184 196 / 70%);
  filter: blur(5px);
  pointer-events: none;
  opacity: .55;
  animation: progress-shimmer 4s ease-in-out infinite alternate;
}

.scene {
  position: relative;
  z-index: 1;
  display: flex;
  flex: 0 0 174px;
  width: 174px;
  height: 144px;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  overflow: hidden;
  border-left: 1px solid rgb(217 189 145 / 19%);
}

.scene-sun {
  position: absolute;
  top: 2px;
  left: 50%;
  width: 67px;
  height: 67px;
  border-radius: 50%;
  background: linear-gradient(
    145deg,
    rgb(235 163 145 / 65%),
    rgb(194 103 125 / 50%)
  );
  box-shadow:
    0 0 24px rgb(218 132 140 / 17%),
    0 0 55px rgb(218 132 140 / 10%);
  transform: translateX(-50%);
  animation: scene-sun-glow 7s ease-in-out infinite alternate;
}

.scene-ring {
  position: absolute;
  left: 50%;
  border: 1px solid rgb(217 189 145 / 19%);
  border-radius: 50%;
  transform: translateX(-50%);
}

.ring-one {
  top: -19px;
  width: 116px;
  height: 116px;
}

.ring-two {
  top: -32px;
  width: 142px;
  height: 142px;
  border-color: rgb(217 189 145 / 10%);
}

.torii {
  position: absolute;
  top: 29px;
  left: 50%;
  width: 140px;
  height: 101px;
  transform: translateX(-50%);
  filter: drop-shadow(0 0 8px rgb(215 125 121 / 16%));
  animation: torii-float 8s ease-in-out infinite alternate;
}

.scene-kanji {
  position: absolute;
  top: 22px;
  right: 7px;
  color: rgb(240 184 196 / 45%);
  font-family: "Noto Serif CJK JP", "Yu Mincho", serif;
  font-size: 25px;
  writing-mode: vertical-rl;
}

.scene-caption {
  position: relative;
  margin-bottom: 7px;
  color: var(--gold);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: .22em;
}

.scene-line {
  width: 75px;
  height: 1px;
  margin-bottom: 6px;
  background: linear-gradient(
    90deg,
    transparent,
    rgb(217 189 145 / 55%),
    transparent
  );
}

.scene-subcaption {
  color: var(--muted);
  font-family: "Noto Sans CJK JP", sans-serif;
  font-size: 9px;
  letter-spacing: .2em;
}

.edge-fade {
  position: absolute;
  z-index: 3;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    transparent 0%,
    transparent 82%,
    rgb(23 26 46 / 9%) 94%,
    transparent 100%
  );
}

.sakura.is-changing .details {
  animation: track-arrive 650ms ease both;
}

.sakura.is-changing .art-frame {
  animation: artwork-arrive 650ms ease both;
}

@keyframes petal-drift {
  0% {
    opacity: 0;
    transform: translate3d(0, -12px, 0) rotate(0deg);
  }
  12% {
    opacity: .8;
  }
  45% {
    transform: translate3d(28px, 85px, 0) rotate(160deg);
  }
  85% {
    opacity: .6;
  }
  100% {
    opacity: 0;
    transform: translate3d(-15px, 200px, 0) rotate(330deg);
  }
}

@keyframes ambient-breathe {
  from { opacity: .55; transform: translateX(-18px) scale(.95); }
  to { opacity: 1; transform: translateX(20px) scale(1.08); }
}

@keyframes moon-breathe {
  from { opacity: .55; transform: scale(.9); }
  to { opacity: 1; transform: scale(1.12); }
}

@keyframes sun-pulse {
  from { opacity: .7; transform: scale(.96); }
  to { opacity: 1; transform: scale(1.04); }
}

@keyframes halo-breathe {
  from { opacity: .45; transform: scale(.95); }
  to { opacity: 1; transform: scale(1.06); }
}

@keyframes status-glow {
  0%, 100% { box-shadow: 0 0 5px rgb(168 212 178 / 35%); }
  50% { box-shadow: 0 0 13px rgb(168 212 178 / 75%); }
}

@keyframes progress-shimmer {
  from { opacity: .3; transform: translateX(0); }
  to { opacity: .75; transform: translateX(24px); }
}

@keyframes scene-sun-glow {
  from { box-shadow: 0 0 20px rgb(218 132 140 / 12%); }
  to { box-shadow: 0 0 36px rgb(218 132 140 / 30%); }
}

@keyframes torii-float {
  from { transform: translate(-50%, 1px); }
  to { transform: translate(-50%, -3px); }
}

@keyframes track-arrive {
  from {
    opacity: .25;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes artwork-arrive {
  from {
    opacity: .45;
    transform: scale(.97);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
'''

[javascript]
source = '''
(() => {
  const root = document.querySelector('.sakura');
  const title = document.getElementById('title');
  const artist = document.getElementById('artist');
  const album = document.getElementById('album');
  const artwork = document.getElementById('artwork');
  const fallback = document.getElementById('art-fallback');
  const stateLabel = document.getElementById('playback-state');
  const progress = document.getElementById('progress');
  const elapsed = document.getElementById('elapsed');
  const durationLabel = document.getElementById('duration');

  if (
    !root ||
    !window.NowPlaying ||
    typeof window.NowPlaying.subscribe !== 'function'
  ) {
    return;
  }

  let currentTrack = null;
  let currentArtworkUrl = null;
  let changeTimer = 0;

  const stateNames = {
    playing: 'NOW PLAYING',
    paused: 'PAUSED',
    stopped: 'STOPPED',
    unknown: 'WAITING FOR PLAYBACK'
  };

  function formatTime(milliseconds) {
    const seconds = Math.max(0, Math.floor(milliseconds / 1000));
    const minutes = Math.floor(seconds / 60);
    const remaining = seconds % 60;

    return minutes + ':' + String(remaining).padStart(2, '0');
  }

  function setArtwork(url) {
    if (url === currentArtworkUrl) return;

    currentArtworkUrl = url || null;

    artwork.onload = null;
    artwork.onerror = null;

    if (!url) {
      artwork.removeAttribute('src');
      artwork.hidden = true;
      fallback.hidden = false;
      return;
    }

    const requestedUrl = url;

    artwork.onload = () => {
      if (currentArtworkUrl !== requestedUrl) return;
      artwork.hidden = false;
      fallback.hidden = true;
    };

    artwork.onerror = () => {
      if (currentArtworkUrl !== requestedUrl) return;
      artwork.hidden = true;
      fallback.hidden = false;
    };

    artwork.hidden = true;
    fallback.hidden = false;
    artwork.src = url;
  }

  function update(snapshot) {
    if (!snapshot) return;

    const metadata = snapshot.metadata || {};
    const artists = Array.isArray(metadata.artists)
      ? metadata.artists.filter(Boolean)
      : [];

    const nextTrack = metadata.trackId ||
      [metadata.title || '', artists.join(', ')].join('|');

    if (currentTrack !== null && nextTrack !== currentTrack) {
      root.classList.remove('is-changing');

      requestAnimationFrame(() => {
        root.classList.add('is-changing');
      });

      clearTimeout(changeTimer);

      changeTimer = setTimeout(() => {
        root.classList.remove('is-changing');
      }, 680);
    }

    currentTrack = nextTrack;

    title.textContent = metadata.title ||
      (snapshot.connected ? 'Unknown track' : 'Nothing playing');

    artist.textContent = artists.join(' · ') ||
      (snapshot.connected ? 'Unknown artist' : 'Waiting for your next song');

    album.textContent = metadata.album || '';

    stateLabel.textContent =
      stateNames[snapshot.status] || stateNames.unknown;

    root.dataset.status = snapshot.status || 'unknown';

    setArtwork(metadata.artworkUrl || null);

    const duration = Number(snapshot.durationMs) || 0;
    const position = Number(snapshot.positionMs) || 0;
    const safePosition = Math.max(0, position);

    const percent = duration > 0
      ? Math.max(0, Math.min(100, safePosition / duration * 100))
      : 0;

    progress.value = percent;
    elapsed.textContent = formatTime(safePosition);
    durationLabel.textContent = duration > 0
      ? formatTime(duration)
      : '--:--';
  }

  window.NowPlaying.subscribe(update);
})();
