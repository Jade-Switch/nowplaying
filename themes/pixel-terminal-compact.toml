
[theme]
id = "pixel-terminal-compact"
name = "Pixel Terminal"
family_id = "pixel-terminal"
version = "1.4.0"
format_version = 1
author = "nowplaying"
description = "Compact green-phosphor terminal with artwork and segmented progress meter"

[theme.compatibility]
minimum_runtime = "0.1.0"

[canvas]
width = 420
height = 120

[artwork]
enabled = true
width = 92
height = 92

[html]
template = '''
<main class="terminal">
  <header>
    <b></b>
    NPS://AUDIO_SESSION
    <span id="status">WAITING</span>
  </header>

  <div class="screen">
    <div class="artwork">
      <img id="artwork" alt="Album artwork" hidden>
      <div class="art-fallback" id="art-fallback">
        <span>♪</span>
        <small>NO IMAGE</small>
      </div>
    </div>

    <section class="information">
      <div class="ascii">┌─ NOW PLAYING ─────────────────────────┐</div>
      <div class="row"><label>TRACK&gt;</label><strong id="title">Nothing playing</strong></div>
      <div class="row"><label>ARTIST&gt;</label><span id="artist">Waiting for player</span></div>
      <div class="row"><label>ALBUM&gt;</label><span id="album">—</span></div>
      <div class="ascii closing">└───────────────────────────────────────┘</div>

      <div class="playback">
        <div class="progress"><div id="progress"></div></div>
        <footer>
          <span id="player">NO PLAYER</span>
          <span class="time"><span id="elapsed">0:00</span> / <span id="duration">--:--</span></span>
        </footer>
      </div>
    </section>
  </div>
</main>
'''

[css]
stylesheet = '''
*{box-sizing:border-box}
body{
  margin:0;
  background:transparent;
  color:#b8ffc5;
  font:10px/1.3 "Courier New",monospace;
}
.terminal{
  width:420px;
  height:120px;
  padding:5px 7px;
  overflow:hidden;
  background:#07130f;
  border:2px solid #3e9d68;
  box-shadow:inset 0 0 0 2px #173e2b;
}
header{
  height:17px;
  display:flex;
  align-items:center;
  padding:0 5px 3px;
  background:#10271d;
  color:#73d995;
  font-size:8px;
  letter-spacing:1px;
}
header b{
  display:inline-block;
  width:6px;
  height:6px;
  flex:none;
  background:#80f49b;
  margin-right:6px;
  box-shadow:0 0 5px #80f49b;
}
header span{
  margin-left:auto;
  color:#e1d98c;
}
.screen{
  height:calc(100% - 17px);
  display:flex;
  align-items:center;
  gap:9px;
  padding:3px 2px 2px;
  min-width:0;
}
.artwork{
  position:relative;
  width:92px;
  height:92px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid #397b50;
  background:#0b2116;
  box-shadow:inset 0 0 0 3px #10271d;
}
.artwork img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}
.artwork img[hidden],
.art-fallback[hidden]{
  display:none!important;
}
.art-fallback{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:#80f49b;
  font-size:27px;
  background:repeating-linear-gradient(
    0deg,
    transparent 0 5px,
    rgba(104,255,147,.035) 5px 6px
  );
}
.art-fallback small{
  color:#438e62;
  font-size:7px;
  letter-spacing:1px;
}
.information{
  height:100%;
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}
.ascii{
  color:#438e62;
  font-size:8px;
  line-height:10px;
  white-space:nowrap;
  overflow:hidden;
}
.row{
  display:flex;
  align-items:baseline;
  gap:6px;
  min-width:0;
  margin:3px 0;
  line-height:12px;
}
.row label{
  flex:none;
  color:#68bd83;
  font-size:8px;
}
.row strong,.row span{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:normal;
}
.row strong{
  color:#c5ffd0;
  font-size:11px;
  font-weight:bold;
}
.row span{color:#9bc9a6}
.closing{margin-top:0}
.playback{
  min-width:0;
  margin-top:5px;
}
.progress{
  height:7px;
  border:1px solid #397b50;
  padding:1px;
  background:#06100c;
}
.progress div{
  height:100%;
  width:0;
  background:repeating-linear-gradient(
    90deg,
    #8cf6a7 0 6px,
    transparent 6px 8px
  );
  transition:width .3s linear;
}
footer{
  height:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:5px;
  margin-top:2px;
  color:#5d9c70;
  font-size:8px;
  line-height:13px;
}
#player{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.time{
  flex:none;
  white-space:nowrap;
  color:#9bc9a6;
  font-variant-numeric:tabular-nums;
}
body[data-status="playing"] header b{
  animation:blink 1.5s steps(2,start) infinite;
}
body[data-status="paused"] header b{
  background:#e1d98c;
  box-shadow:0 0 5px #e1d98c;
  animation:none;
}
body[data-connected="false"] header b{
  background:#a65e5e;
  box-shadow:0 0 5px #a65e5e;
  animation:none;
}
@keyframes blink{to{opacity:.35}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}
'''

[javascript]
source = '''
(() => {
  const $ = id => document.getElementById(id);

  const put = (id, value) => {
    const node = $(id);
    if (node) node.textContent = value;
  };

  const time = ms => {
    const seconds = Math.floor(ms / 1000);
    return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
  };

  let requestedArtwork = null;

  function updateArtwork(url) {
    const img = $("artwork");
    const fallback = $("art-fallback");
    if (!img || !fallback) return;

    if (!url) {
      requestedArtwork = null;
      img.onload = null;
      img.onerror = null;
      img.removeAttribute("src");
      img.hidden = true;
      fallback.hidden = false;
      return;
    }

    if (url === requestedArtwork) return;

    requestedArtwork = url;
    img.onload = () => {
      if (requestedArtwork !== url) return;
      img.hidden = false;
      fallback.hidden = true;
    };
    img.onerror = () => {
      if (requestedArtwork !== url) return;
      img.hidden = true;
      fallback.hidden = false;
    };

    img.hidden = true;
    fallback.hidden = false;
    img.src = url;
  }

  function render(s) {
    if (!s) return;

    const m = s.metadata || {};
    const artists = Array.isArray(m.artists)
      ? m.artists.filter(x => typeof x === "string" && x.trim()).join(" · ")
      : "";

    const status = s.connected
      ? (s.status || "unknown")
      : "disconnected";

    put(
      "title",
      typeof m.title === "string" && m.title.trim()
        ? m.title
        : "Nothing playing"
    );

    put(
      "artist",
      artists || (s.connected ? "Unknown artist" : "Waiting for player")
    );

    put(
      "album",
      typeof m.album === "string" && m.album.trim()
        ? m.album
        : "—"
    );

    put("status", status.toUpperCase());
    put(
      "player",
      s.player && s.player.identity
        ? s.player.identity
        : "NO PLAYER"
    );

    const duration =
      Number.isFinite(s.durationMs) && s.durationMs > 0
        ? s.durationMs
        : 0;

    const position =
      Number.isFinite(s.positionMs) && s.positionMs >= 0
        ? s.positionMs
        : 0;

    const percentage = duration
      ? Math.min(100, position / duration * 100)
      : 0;

    put("elapsed", time(position));
    put("duration", duration ? time(duration) : "--:--");

    const bar = $("progress");
    if (bar) bar.style.width = percentage + "%";

    updateArtwork(
      typeof m.artworkUrl === "string" ? m.artworkUrl : ""
    );

    document.body.dataset.status = status;
    document.body.dataset.connected = s.connected ? "true" : "false";
  }

  if (window.NowPlaying && typeof window.NowPlaying.subscribe === "function") {
    window.NowPlaying.subscribe(render);
  }
})();
'''
