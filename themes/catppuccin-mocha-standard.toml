[theme]
id = "catppuccin-mocha-standard"
name = "Catppuccin Mocha"
family_id = "catppuccin-mocha"
version = "1.0.1"
format_version = 1
author = "nowplaying"
description = "A standard album-art and metadata display using the Catppuccin Mocha palette."

[theme.compatibility]
minimum_runtime = "0.1.0"

[canvas]
width = 800
height = 150
background = "transparent"

[layout]
direction = "horizontal"
alignment = "center"
spacing = 20
padding = 10

[artwork]
enabled = true
position = "left"
width = 120
height = 120
fit = "contain"
rendering = "auto"

[metadata]
show_title = true
show_artist = true
show_album = true
alignment = "start"

[progress]
enabled = true
position = "bottom"
height = 4

[animations]
enabled = true
reduced_motion_support = true
track_change = "crossfade"
track_change_duration_ms = 320

[colors]
background = "transparent"
text = "#cdd6f4"
muted = "#a6adc8"
accent = "#cba6f7"

[html]
template = '''
<main class="player" data-status="unknown" aria-live="polite">
  <div class="art-frame">
    <img class="artwork" id="artwork" alt="Album artwork" hidden />
    <div class="disc" id="art-fallback" aria-hidden="true">
      <span class="disc-label"></span>
    </div>
  </div>

  <section class="details">
    <div class="eyebrow">
      <span class="status-dot"></span>
      <span id="playback-state">NOT PLAYING</span>
    </div>

    <h1 class="title" id="title">Nothing playing</h1>
    <p class="artist" id="artist">Choose a media player</p>
    <p class="album" id="album"></p>

    <div class="progress-row">
      <span class="time" id="elapsed">0:00</span>
      <progress
        class="progress"
        id="progress"
        aria-label="Track progress"
        max="100"
        value="0"
      ></progress>
      <span class="time" id="duration">0:00</span>
    </div>
  </section>
</main>
'''

[css]
stylesheet = '''
:root {
  color-scheme: dark;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;

  --base: #1e1e2e;
  --mantle: #181825;
  --crust: #11111b;
  --surface-0: #313244;
  --surface-1: #45475a;
  --overlay-0: #6c7086;
  --subtext-0: #a6adc8;
  --text: #cdd6f4;
  --mauve: #cba6f7;
  --lavender: #b4befe;
  --green: #a6e3a1;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: transparent;
  color: var(--text);
}

.player {
  display: flex;
  align-items: center;
  gap: 18px;
  width: 800px;
  height: 150px;
  padding: 10px;
  overflow: hidden;
  background: transparent;
}

.art-frame {
  position: relative;
  flex: 0 0 120px;
  width: 120px;
  height: 120px;
  overflow: hidden;
  border: 1px solid rgb(205 214 244 / 12%);
  border-radius: 18px;
  background: linear-gradient(145deg, var(--surface-1), var(--mantle));
  box-shadow: 0 12px 28px rgb(17 17 27 / 28%);
}

.artwork {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.disc {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  background:
    radial-gradient(
      circle,
      transparent 0 13%,
      rgb(17 17 27 / 74%) 13.5% 14.5%,
      transparent 15% 27%,
      rgb(17 17 27 / 26%) 27.5% 28%,
      transparent 28.5% 43%,
      rgb(17 17 27 / 22%) 43.5% 44%,
      transparent 44.5%
    );
}

.disc-label {
  width: 18px;
  height: 18px;
  border: 5px solid var(--mauve);
  border-radius: 50%;
  background: var(--crust);
}

.details {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
  align-items: stretch;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 11px;
  color: var(--subtext-0);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .16em;
}

.status-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: var(--overlay-0);
}

.player[data-status="playing"] .status-dot {
  background: var(--green);
  box-shadow: 0 0 10px rgb(166 227 161 / 52%);
}

.player[data-status="paused"] .status-dot {
  background: var(--mauve);
}

.title {
  overflow: hidden;
  margin: 0;
  color: var(--text);
  font-size: 23px;
  font-weight: 650;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.artist {
  overflow: hidden;
  margin: 7px 0 0;
  color: var(--lavender);
  font-size: 15px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.album {
  overflow: hidden;
  min-height: 17px;
  margin: 5px 0 0;
  color: var(--subtext-0);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  margin-top: 13px;
}

.time {
  flex: 0 0 auto;
  min-width: 31px;
  color: var(--overlay-0);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}

.time:last-child {
  text-align: right;
}

.progress {
  display: block;
  min-width: 0;
  flex: 1;
  height: 4px;
  overflow: hidden;
  margin: 0;
  border: 0;
  border-radius: 99px;
  appearance: none;
  background: rgb(108 112 134 / 38%);
}

.progress::-webkit-progress-bar {
  border-radius: 99px;
  background: rgb(108 112 134 / 38%);
}

.progress::-webkit-progress-value {
  border-radius: 99px;
  background: linear-gradient(90deg, var(--mauve), var(--lavender));
  transition: width 350ms linear;
}

.progress::-moz-progress-bar {
  border-radius: 99px;
  background: linear-gradient(90deg, var(--mauve), var(--lavender));
}

.player.is-changing .details {
  animation: arrive 320ms ease both;
}

@keyframes arrive {
  from {
    opacity: .35;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
'''

[javascript]
source = '''
(() => {
  const root = document.querySelector('.player');
  const title = document.getElementById('title');
  const artist = document.getElementById('artist');
  const album = document.getElementById('album');
  const artwork = document.getElementById('artwork');
  const fallback = document.getElementById('art-fallback');
  const stateLabel = document.getElementById('playback-state');
  const progress = document.getElementById('progress');
  const elapsed = document.getElementById('elapsed');
  const durationLabel = document.getElementById('duration');

  if (!root || !window.NowPlaying ||
      typeof window.NowPlaying.subscribe !== 'function') {
    return;
  }

  let currentTrack = null;
  let currentArtworkUrl = null;
  let changeTimer = 0;

  const stateNames = {
    playing: 'NOW PLAYING',
    paused: 'PAUSED',
    stopped: 'STOPPED',
    unknown: 'NOT PLAYING'
  };

  function formatTime(milliseconds) {
    const seconds = Math.max(0, Math.floor(milliseconds / 1000));
    const minutes = Math.floor(seconds / 60);
    const remaining = seconds % 60;

    return minutes + ':' + String(remaining).padStart(2, '0');
  }

  function setArtwork(url) {
    if (url === currentArtworkUrl) return;

    currentArtworkUrl = url || null;
    artwork.onload = null;
    artwork.onerror = null;

    if (!url) {
      artwork.removeAttribute('src');
      artwork.hidden = true;
      fallback.hidden = false;
      return;
    }

    const requestedUrl = url;

    artwork.onload = () => {
      if (currentArtworkUrl !== requestedUrl) return;
      artwork.hidden = false;
      fallback.hidden = true;
    };

    artwork.onerror = () => {
      if (currentArtworkUrl !== requestedUrl) return;
      artwork.hidden = true;
      fallback.hidden = false;
    };

    artwork.hidden = true;
    fallback.hidden = false;
    artwork.src = url;
  }

  function update(snapshot) {
    if (!snapshot) return;

    const metadata = snapshot.metadata || {};
    const artists = Array.isArray(metadata.artists)
      ? metadata.artists.filter(Boolean)
      : [];

    const nextTrack = metadata.trackId ||
      [metadata.title || '', artists.join(', ')].join('|');

    if (currentTrack !== null && nextTrack !== currentTrack) {
      root.classList.remove('is-changing');
      requestAnimationFrame(() => root.classList.add('is-changing'));

      clearTimeout(changeTimer);
      changeTimer = setTimeout(() => {
        root.classList.remove('is-changing');
      }, 360);
    }

    currentTrack = nextTrack;

    title.textContent = metadata.title ||
      (snapshot.connected ? 'Unknown track' : 'Nothing playing');

    artist.textContent = artists.join(' · ') ||
      (snapshot.connected ? 'Unknown artist' : 'Choose a media player');

    album.textContent = metadata.album || '';

    stateLabel.textContent =
      stateNames[snapshot.status] || stateNames.unknown;

    root.dataset.status = snapshot.status || 'unknown';

    setArtwork(metadata.artworkUrl || null);

    const duration = Number(snapshot.durationMs) || 0;
    const position = Number(snapshot.positionMs) || 0;

    const safePosition = Math.max(0, position);
    const percent = duration > 0
      ? Math.max(0, Math.min(100, safePosition / duration * 100))
      : 0;

    progress.value = percent;
    elapsed.textContent = formatTime(safePosition);
    durationLabel.textContent = duration > 0
      ? formatTime(duration)
      : '--:--';
  }

  window.NowPlaying.subscribe(update);
})();
'''
