name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libegl-dev libgl-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Cachix write token
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.CACHIX_CACHE_NAME != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "$CACHIX_AUTH_TOKEN" || (echo "::error::Set the CACHIX_AUTH_TOKEN Actions secret." && exit 1)
      - name: Configure Cachix for trusted main-branch builds
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.CACHIX_CACHE_NAME != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Report skipped Cachix setup
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.CACHIX_CACHE_NAME == ''
        run: echo "::warning::Set the CACHIX_CACHE_NAME Actions variable and CACHIX_AUTH_TOKEN secret to publish Nix builds to Cachix."
      - run: nix build --accept-flake-config --no-link .#packages.x86_64-linux.nowplaying

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
      - name: Install Freedesktop SDK and Rust extension
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Generate offline Cargo sources from Cargo.lock
        run: python3 packaging/flatpak/generate-cargo-sources.py
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo="$RUNNER_TEMP/flatpak-repo" \
            "$RUNNER_TEMP/flatpak-build" \
            packaging/flatpak/io.github.JadeSwitch.nowplaying.yml
          flatpak build-bundle "$RUNNER_TEMP/flatpak-repo" \
            "$RUNNER_TEMP/nowplaying.flatpak" \
            io.github.JadeSwitch.nowplaying stable
