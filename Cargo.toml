[package]
name = "nowplaying"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight local nowplaying runtime and theme switcher"

[lib]
name = "nowplaying"

[[bin]]
name = "nowplaying"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.23"
futures-util = "0.3"
fs2 = "0.4.3"
iced = { version = "0.14", default-features = false, features = ["image", "tiny-skia", "tokio", "wayland"] }
ksni = "0.3.7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
sha2 = "0.11"
url = "2.5"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
