name: now-playing-studio
title: Now Playing Studio
version: '0.1.0'
summary: MPRIS player monitor and OBS browser source
description: |
  A Linux desktop application that reads MPRIS playback state and presents it
  through customizable themes and a loopback HTTP service for OBS Browser
  Sources.
base: core24
confinement: strict
grade: stable
icon: ../../assets/now-playing-studio.svg

apps:
  now-playing-studio:
    command: bin/now-playing-studio
    desktop: usr/share/applications/now-playing-studio.desktop
    environment:
      XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
      XDG_DATA_HOME: $SNAP_USER_DATA/.local/share
      XDG_CACHE_HOME: $SNAP_USER_DATA/.cache
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - mpris
      - network
      - network-bind

parts:
  now-playing-studio:
    plugin: rust
    source: ../..
    rust-path: .
    build-packages:
      - build-essential
      - pkg-config
      - libwayland-dev
      - libxkbcommon-dev
      - libegl-dev
      - libgl-dev
    stage-packages:
      - libwayland-client0
      - libxkbcommon0
      - libegl1
      - libgl1
      - xdg-utils
    override-build: |
      craftctl default
      install -Dm0644 "$CRAFT_PART_SRC/packaging/snap/now-playing-studio.desktop" \
        "$CRAFT_PART_INSTALL/usr/share/applications/now-playing-studio.desktop"
      install -Dm0644 "$CRAFT_PART_SRC/assets/now-playing-studio.svg" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/now-playing-studio.svg"
