app-id: io.github.JadeSwitch.nowplaying
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: nowplaying

finish-args:
  - --env=NOWPLAYING_APP_ID=io.github.JadeSwitch.nowplaying
  - --share=network
  - --socket=wayland
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.mpris.MediaPlayer2.*
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: nowplaying
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/nowplaying/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --offline --locked --release
      - install -Dm0755 target/release/nowplaying /app/bin/nowplaying
      - install -Dm0644 packaging/flatpak/io.github.JadeSwitch.nowplaying.desktop /app/share/applications/io.github.JadeSwitch.nowplaying.desktop
      - install -Dm0644 assets/nowplaying.svg /app/share/icons/hicolor/scalable/apps/io.github.JadeSwitch.nowplaying.svg
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
