app-id: io.github.Jade-Switch.nowplaying
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: now-playing-studio

finish-args:
  - --env=NOW_PLAYING_STUDIO_APP_ID=io.github.Jade-Switch.nowplaying
  - --share=network
  - --socket=wayland
  - --talk-name=org.freedesktop.DBus
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.mpris.MediaPlayer2.*
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-*

modules:
  - name: now-playing-studio
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/now-playing-studio/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --offline --locked --release
      - install -Dm0755 target/release/now-playing-studio /app/bin/now-playing-studio
      - install -Dm0644 packaging/flatpak/io.github.Jade-Switch.nowplaying.desktop /app/share/applications/io.github.Jade-Switch.nowplaying.desktop
      - install -Dm0644 assets/now-playing-studio.svg /app/share/icons/hicolor/scalable/apps/io.github.Jade-Switch.nowplaying.svg
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
